<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#272e3b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Site Survey – EDP Reports</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets/icon-192.png">
<link rel="apple-touch-icon" href="assets/icon-192.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="app">
  <a class="icon" href="index.html#projects" data-i18n-title="back">←</a>
  <img class="logo" src="assets/edp-logo.jpg" alt="EDP">
  <div class="titles"><strong>Site Survey</strong><small id="saveStatus" data-i18n="ready">Ready</small></div>
  <div id="langSwitch" class="lang-switch"></div>
  <button id="installBtn" class="icon" data-i18n-title="install">↓</button>
</header>
<main>
  <nav class="tabs" id="tabs"></nav>
  <div id="panels"></div>
  <p class="footer">EDP Reports v5.2 · Site Survey</p>
</main>
<div class="actions">
  <button class="secondary" id="resetBtn" data-i18n="newReport">New</button>
  <button class="secondary" id="pdfBtn" data-i18n="downloadPdf">Download PDF</button>
  <button class="primary" id="shareBtn" data-i18n="sendPdf">Send PDF ↗</button>
</div>
<div id="toast"></div>
<script src="i18n.js"></script>
<script src="common.js"></script>
<script src="tools.js"></script>
<script src="auth.js"></script>
<script src="pdf-engine.js"></script>
<script src="survey.js"></script>
</body>
</html>
